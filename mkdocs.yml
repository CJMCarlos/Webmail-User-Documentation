site_name: Webmail-User-Documentation
site_url: https://mydomain.org/Webmail-User-Documentation

nav:
  - Home: index.md
  - Setting up external email client: Setting up external email client.md
  - Setting up identity: Setting up identity.md
  - Filtering Submission Receipts: Filtering Submission Receipts.md
  - Signing up for student benefits: Signing up for student benefits.md
  - Troubleshooting: Troubleshooting.md
  - Glossary: Glossary.md

repo_name: CJMCarlos/Webmail-User-Documentation/
repo_url: https://github.com/CJMCarlos/Webmail-User-Documentation/

theme:
  name: material
  features:
    - navigation.footer
    - toc.integrate
  palette:
    scheme: header1
    primary: indigo

  logo: assets/channels4_profile.jpg
  favicon: assets/channels4_profile.jpg

# MARKDOWN EXTENSIONS
markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - pymdownx.tasklist
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheet/extra.css

